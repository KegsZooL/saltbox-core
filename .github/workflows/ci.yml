name: CI


on:
  pull_request


jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .[dev]
      - run: ruff check saltbox_core


  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .[dev]
      - run: mypy saltbox_core


  pytest:
    runs-on: ubuntu-latest
    env:
      SALTBOX_ENV_FILE: 'tests/test.env'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .[dev]
      - run: pytest
